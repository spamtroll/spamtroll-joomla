name: QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: composer stan

      - name: PHPUnit
        run: composer test

  package:
    name: Installable package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      # A package without vendor/ does not merely fail to scan: services/provider.php
      # cannot class-load JoomlaHttpClient, and because system plugins are imported
      # during bootstrap that fatals every request to the site. Build the real
      # artefact and look inside it.
      - name: Build package
        run: bash build/build-package.sh

      - name: Assert the SDK is bundled
        run: |
          set -euo pipefail
          zip=$(ls dist/plg_system_spamtroll-*.zip)
          echo "checking ${zip}"
          for entry in \
            spamtroll.xml \
            services/provider.php \
            vendor/autoload.php \
            vendor/spamtroll/php-sdk/src/Client.php \
            vendor/spamtroll/php-sdk/src/Http/HttpClientInterface.php
          do
            unzip -l "${zip}" "${entry}" > /dev/null
            echo "  ok ${entry}"
          done

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: plg_system_spamtroll
          path: dist/*.zip
